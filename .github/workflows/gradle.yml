name: Build Java Project

on:
  workflow_dispatch:   # Allows manual trigger
  push:
    branches:
      - '**'          # Runs on all branches

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - uses: actions/checkout@v3

    # 2. Set up JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    # 3. Cache Gradle user home (~/.gradle) for faster builds
    - name: Cache Gradle User Home
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: gradle-user-home-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-user-home-${{ runner.os }}-

    # 4. Cache project Gradle files (like build cache)
    - name: Cache Project Gradle Files
      uses: actions/cache@v4
      with:
        path: ./.gradle
        key: gradle-project-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-project-cache-${{ runner.os }}-

    # 5. Make gradlew executable
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 6. Build the project
    - name: Build
      env:
        ARCLIGHT_FILES_TOKEN: ${{ secrets.ARCLIGHT_FILES_TOKEN }}
      run: |
        ./gradlew cleanBuild build collect uploadFiles --no-daemon --stacktrace

    # 7. Upload the JAR as an artifact
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: feudalkings-jar
        path: build/libs/*.jar
